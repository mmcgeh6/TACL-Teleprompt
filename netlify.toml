[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: send every path to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Microphone is needed for voice-follow mode
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "microphone=(self)"
